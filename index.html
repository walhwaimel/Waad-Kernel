    <style vid="8">
        :root {
            
            --bg-base: #06080d;
            --bg-panel: rgba(14, 18, 26, 0.7);
            --bg-panel-solid: #0e121a;
            
            --neon-cyan: #00f0ff;
            --neon-cyan-dim: rgba(0, 240, 255, 0.2);
            --neon-magenta: #ff0055;
            --neon-amber: #ff9f00;
            --neon-amber-dim: rgba(255, 159, 0, 0.2);
            --neon-white: #ffffff;
            
            --text-main: #e2e8f0;
            --text-muted: #64748b;
            
            
            --font-ui: 'Rajdhani', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            
            
            --glow-cyan: 0 0 10px rgba(0, 240, 255, 0.6), 0 0 20px rgba(0, 240, 255, 0.2);
            --glow-amber: 0 0 10px rgba(255, 159, 0, 0.6), 0 0 20px rgba(255, 159, 0, 0.2);
            --glow-magenta: 0 0 10px rgba(255, 0, 85, 0.6);
            --glow-white: 0 0 15px rgba(255, 255, 255, 0.8);
            
            
            --border-radius: 4px;
            --grid-gap: 2rem;
        }

        html[data-theme="light"] {
            --bg-primary: #eef1f6;
            --bg-card: #ffffff;
            --bg-nav: #0d1829;
            --text-primary: #0d1829;
            --text-muted: #4a6080;
            --text-nav: #eef1f6;
            --accent: #00c9b1;
            --accent-text: #002e28;
            --border: #c8d0dc;
            --bg-base: var(--bg-primary);
            --bg-panel: var(--bg-card);
            --bg-panel-solid: var(--bg-card);
            --neon-cyan: var(--accent);
            --neon-cyan-dim: rgba(0, 201, 177, 0.12);
            --neon-amber: var(--accent);
            --neon-amber-dim: rgba(0, 201, 177, 0.10);
            --neon-magenta: var(--accent);
            --neon-white: var(--text-primary);
            --text-main: var(--text-primary);
            --text-muted: #4a6080;
            --glow-cyan: 0 6px 18px rgba(13, 24, 41, 0.04);
            --glow-amber: 0 6px 18px rgba(13, 24, 41, 0.04);
            --glow-magenta: 0 6px 18px rgba(13, 24, 41, 0.04);
            --glow-white: none;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: var(--font-ui);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            background-position: center center;
        }

        html[data-theme="light"] body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            background-image:
                linear-gradient(rgba(13, 24, 41, 0.018) 1px, transparent 1px),
                linear-gradient(90deg, rgba(13, 24, 41, 0.018) 1px, transparent 1px);
        }

        html[data-theme="light"] .ambient-light {
            background:
                radial-gradient(circle at 20% 10%, rgba(0, 201, 177, 0.05) 0%, transparent 34%),
                radial-gradient(circle at 82% 20%, rgba(13, 24, 41, 0.035) 0%, transparent 30%);
        }

        
        .ambient-light {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 100vh;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle at center, rgba(0, 240, 255, 0.05) 0%, transparent 60%);
            pointer-events: none;
            z-index: -1;
        }

        
        .system-container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 1.5rem 2rem 2rem;
            display: grid;
            grid-template-columns: 80px 1fr;
            gap: 1.5rem;
            min-height: 100vh;
        }

        
        .side-telemetry {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            border-right: 1px solid var(--neon-cyan-dim);
            padding-right: 1rem;
            font-family: var(--font-mono);
            font-size: 0.65rem;
            color: var(--neon-cyan);
            opacity: 0.7;
        }

        .data-block {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        body[data-language="ar"] .system-container {
            grid-template-columns: 128px 1fr;
        }

        body[data-language="ar"] .side-telemetry {
            font-family: var(--font-ui);
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            line-height: 1.25;
            text-align: right;
            direction: rtl;
            gap: 1rem;
            padding-right: 0.35rem;
            padding-left: 1.25rem;
            align-items: stretch;
            border-right: 0;
            border-left: 1px solid var(--neon-cyan-dim);
        }

        body[data-language="ar"] .data-block {
            width: 100%;
            align-items: stretch;
        }

        body[data-language="ar"] .data-block span {
            display: block;
            width: 100%;
            white-space: nowrap;
            direction: rtl;
            text-align: right;
        }

        body[data-language="ar"] .data-bar {
            width: 100%;
        }

        html[data-theme="light"] .side-telemetry {
            color: var(--accent);
            border-color: rgba(200, 208, 220, 0.75);
            opacity: 0.86;
        }

        html[data-theme="light"] .data-bar {
            background: #dfe5ee;
        }

        html[data-theme="light"] .data-bar-fill {
            background: var(--accent);
            box-shadow: none;
        }

        .data-bar {
            height: 4px;
            width: 100%;
            background: var(--bg-panel-solid);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 4px;
        }

        .data-bar-fill {
            height: 100%;
            background: var(--neon-cyan);
            box-shadow: var(--glow-cyan);
            animation: pulse-width 3s infinite alternate ease-in-out;
        }

        @keyframes pulse-width {
            0% { width: 30%; }
            100% { width: 85%; }
        }

        .main-interface {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }

        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--neon-cyan-dim);
            padding-bottom: 1rem;
            position: relative;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 20%;
            height: 2px;
            background: var(--neon-cyan);
            box-shadow: var(--glow-cyan);
        }

        body[data-language="ar"] header::after {
            left: auto;
            right: 0;
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-box {
            width: 40px;
            height: 40px;
            border: 2px solid var(--neon-amber);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: var(--font-mono);
            font-weight: 800;
            color: var(--neon-amber);
            font-size: 1.2rem;
            box-shadow: var(--glow-amber);
            border-radius: var(--border-radius);
            position: relative;
        }

        .logo-box::before {
            content: '';
            position: absolute;
            top: -5px; right: -5px; bottom: -5px; left: -5px;
            border: 1px solid var(--neon-amber-dim);
            border-radius: calc(var(--border-radius) + 2px);
        }

        .brand-name {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .sys-status {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--neon-magenta);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border: 1px solid var(--neon-magenta);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            box-shadow: var(--glow-magenta);
            text-transform: uppercase;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--neon-magenta);
            border-radius: 50%;
            animation: blink 1s infinite;
        }

        .logo-group {
            color: inherit;
            text-decoration: none;
        }

        .home-nav {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-family: var(--font-mono);
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 1.1px;
            text-transform: uppercase;
        }

        .home-nav a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s ease, text-shadow 0.2s ease;
        }

        body[data-language="ar"] .home-nav a {
            font-family: "IBM Plex Sans Arabic", var(--font-ui);
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .home-nav a:not(:last-child)::after {
            content: '\00B7';
            color: var(--text-muted);
            opacity: 0.6;
            margin-inline-start: 0.85rem;
            text-shadow: none;
        }

        .home-nav a:hover,
        .home-nav a:focus-visible {
            color: var(--neon-cyan);
            text-shadow: var(--glow-cyan);
        }

        .home-site-footer {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            margin: 0 2rem 2rem 100px;
            padding: 1rem 2rem;
            border-top: 1px solid var(--neon-cyan-dim);
            color: var(--text-muted);
            font-family: var(--font-mono);
            font-size: 0.65rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        html[data-theme="light"] header {
            background: var(--bg-nav);
            border: 1px solid rgba(238, 241, 246, 0.08);
            border-bottom-color: rgba(0, 201, 177, 0.20);
            border-radius: 0.75rem;
            padding: 0.9rem 1rem;
            box-shadow: 0 18px 42px rgba(13, 24, 41, 0.10);
        }

        html[data-theme="light"] header::after {
            bottom: -1px;
            background: var(--accent);
            box-shadow: 0 4px 14px rgba(0, 201, 177, 0.08);
        }

        html[data-theme="light"] .logo-box {
            color: var(--accent-text);
            background: var(--accent);
            border-color: rgba(0, 201, 177, 0.55);
            box-shadow: none;
        }

        html[data-theme="light"] .logo-box::before {
            border-color: rgba(0, 201, 177, 0.20);
        }

        html[data-theme="light"] .brand-name,
        html[data-theme="light"] .home-nav a,
        html[data-theme="light"] .home-nav a:not(:last-child)::after {
            color: var(--text-nav);
            text-shadow: none;
        }

        html[data-theme="light"] .section-header,
        html[data-theme="light"] .hero-title {
            color: var(--text-primary);
            text-shadow: none;
        }

        html[data-theme="light"] .home-site-footer {
            color: var(--text-muted);
        }

        html[data-theme="light"] .home-nav a:hover,
        html[data-theme="light"] .home-nav a:focus-visible {
            color: var(--accent);
            text-shadow: none;
        }

        html[data-theme="light"] .sys-status {
            color: var(--text-nav);
            border-color: rgba(0, 201, 177, 0.28);
            box-shadow: none;
            background: rgba(0, 201, 177, 0.08);
        }

        html[data-theme="light"] .status-dot {
            background: var(--accent);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        
        .hero {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
            align-items: center;
            position: relative;
            padding: 0.75rem 0 0.25rem;
        }

        .hero-content {
            position: relative;
            z-index: 10;
        }

        .greeting-label {
            font-family: var(--font-mono);
            color: var(--neon-cyan);
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .greeting-label::before {
            content: '>';
            color: var(--neon-amber);
        }

        .hero-title {
            font-size: 5rem;
            line-height: 0.9;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: -1px;
            margin-bottom: 1rem;
            color: var(--neon-white);
            text-shadow: var(--glow-white);
        }

        html[data-theme="light"] .greeting-label {
            color: var(--accent);
        }

        .hero-subtitle {
            font-size: 1.5rem;
            color: var(--text-muted);
            font-weight: 500;
            display: inline-block;
            border-left: 4px solid var(--neon-amber);
            padding-left: 1rem;
            background: linear-gradient(90deg, rgba(255,159,0,0.1) 0%, transparent 100%);
            padding: 0.5rem 1rem;
        }

        html[data-theme="light"] .hero-subtitle {
            color: var(--text-muted);
            border-left-color: var(--accent);
            background: linear-gradient(90deg, rgba(0, 201, 177, 0.08) 0%, rgba(255, 255, 255, 0) 100%);
        }

        html[data-theme="light"] .highlight {
            color: var(--accent);
            text-shadow: none;
        }

        .highlight {
            color: var(--neon-amber);
            text-shadow: var(--glow-amber);
        }

        
        .robot-container {
            position: relative;
            width: 100%;
            max-width: 360px;
            aspect-ratio: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            justify-self: center;
        }

        
        .robot-frame {
            position: absolute;
            width: 90%;
            height: 90%;
            border: 1px solid var(--neon-cyan-dim);
            border-radius: 50%;
        }

        html[data-theme="light"] .robot-container {
            opacity: 0.82;
            filter: saturate(0.62) contrast(0.92);
        }

        html[data-theme="light"] .robot-frame {
            border-color: rgba(0, 201, 177, 0.22);
        }

        html[data-theme="light"] .robot-frame::before,
        html[data-theme="light"] .robot-frame::after {
            background: var(--accent);
        }

        .robot-frame::before {
            content: '';
            position: absolute;
            top: -10px; left: 50%; transform: translateX(-50%);
            width: 20px; height: 4px; background: var(--neon-cyan);
        }

        .robot-frame::after {
            content: '';
            position: absolute;
            bottom: -10px; left: 50%; transform: translateX(-50%);
            width: 20px; height: 4px; background: var(--neon-cyan);
        }

        .robot-svg {
            width: 80%;
            height: 80%;
            overflow: visible;
        }

        
        @keyframes rotate-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes rotate-fast-reverse {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        @keyframes wave-arm {
            0%, 100% { transform: rotate(-10deg); }
            20% { transform: rotate(30deg); }
            40% { transform: rotate(10deg); }
            60% { transform: rotate(30deg); }
            80% { transform: rotate(-10deg); }
        }
        @keyframes pulse-core {
            0%, 100% { filter: drop-shadow(0 0 10px var(--neon-cyan)); }
            50% { filter: drop-shadow(0 0 30px var(--neon-cyan)); }
        }

        .robot-group { animation: float 6s ease-in-out infinite; }
        .ring-outer { animation: rotate-slow 20s linear infinite; transform-origin: center; }
        .ring-inner { animation: rotate-fast-reverse 10s linear infinite; transform-origin: center; }
        .arm-joint { 
            transform-origin: 300px 200px; 
            animation: wave-arm 4s ease-in-out infinite; 
        }
        .core-glow { animation: pulse-core 2s ease-in-out infinite; }

        
        .terminal-banner {
            background: #000;
            border: 1px solid var(--neon-cyan);
            box-shadow: var(--glow-cyan);
            padding: 1.5rem;
            font-family: var(--font-mono);
            font-size: 1.1rem;
            color: var(--neon-cyan);
            border-radius: var(--border-radius);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        html[data-theme="light"] .terminal-banner {
            background: var(--bg-card);
            border-color: var(--border);
            color: var(--text-primary);
            box-shadow: 0 14px 32px rgba(13, 24, 41, 0.07);
        }

        html[data-theme="light"] .terminal-banner::before {
            background: var(--accent);
            color: var(--accent-text);
        }

        html[data-theme="light"] .typing-text {
            border-color: var(--accent);
            text-shadow: none;
        }

        .terminal-banner::before {
            content: 'WK_SYS_TERM //';
            position: absolute;
            top: 0; left: 0;
            background: var(--neon-cyan);
            color: #000;
            font-size: 0.6rem;
            padding: 2px 8px;
            font-weight: bold;
        }

        .typing-text {
            white-space: nowrap;
            overflow: hidden;
            border-right: 10px solid var(--neon-cyan);
            animation: typing 4s steps(60, end) infinite alternate, blink-caret .75s step-end infinite;
            text-shadow: var(--glow-cyan);
        }

        body[data-language="ar"] .typing-text {
            display: inline-block;
            width: auto;
            direction: rtl;
            unicode-bidi: plaintext;
            text-align: right;
            border-right: 0;
            border-left: 10px solid var(--neon-cyan);
            animation: blink-caret .75s step-end infinite;
        }

        body[data-language="ar"] .hero-subtitle,
        body[data-language="ar"] .section-header,
        body[data-language="ar"] .home-site-footer,
        body[data-language="ar"] .sys-status {
            font-family: "IBM Plex Sans Arabic", var(--font-ui);
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        body[data-language="ar"] .cta-button {
            font-family: "Tajawal", var(--font-ui);
            font-weight: 800;
        }

        @keyframes typing {
            from { width: 0 }
            to { width: 100% }
        }
        @keyframes blink-caret {
            from, to { border-color: transparent }
            50% { border-color: var(--neon-cyan); }
        }

        
        .section-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
            font-size: 1.5rem;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--neon-white);
        }

        .section-header::before {
            content: '';
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 2px solid var(--neon-magenta);
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 2px,
                var(--neon-magenta) 2px,
                var(--neon-magenta) 4px
            );
        }

        html[data-theme="light"] .section-header::before {
            border-color: rgba(0, 201, 177, 0.28);
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 4px,
                rgba(0, 201, 177, 0.08) 4px,
                rgba(0, 201, 177, 0.08) 8px
            );
        }

        .cta-button-row {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1rem;
        }

        .cta-button {
            min-height: 72px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--border-radius);
            font-family: var(--font-mono);
            font-weight: 800;
            font-size: 0.95rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .cta-button-outline {
            background: transparent;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            box-shadow: inset 0 0 18px rgba(0, 240, 255, 0.08);
        }

        html[data-theme="light"] .cta-button-outline {
            background: var(--bg-card);
            border-color: var(--border);
            color: var(--text-primary);
            box-shadow: 0 12px 28px rgba(13, 24, 41, 0.06);
        }

        .cta-button:hover {
            transform: translateY(-3px);
            letter-spacing: 2px;
        }

        .cta-button-outline:hover {
            background: var(--neon-cyan-dim);
            box-shadow: var(--glow-cyan);
        }

        html[data-theme="light"] .cta-button-outline:hover {
            background: #f8fbfc;
            border-color: rgba(0, 201, 177, 0.45);
            box-shadow: 0 16px 34px rgba(13, 24, 41, 0.08);
        }

        
        .scanline {
            width: 100%;
            height: 100px;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0.05) 50%, rgba(0,0,0,0));
            position: fixed;
            top: 0;
            pointer-events: none;
            animation: scan 8s linear infinite;
            z-index: 9999;
        }

        html[data-theme="light"] .scanline {
            display: none;
        }

        @keyframes scan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100vh); }
        }

        
        @media (max-width: 1024px) {
            .hero { grid-template-columns: 1fr; text-align: center; padding: 0.75rem 0 0.25rem; gap: 0.75rem; }
            .hero-title { font-size: 4rem; }
            .robot-container { max-width: 300px; }
            .greeting-label { justify-content: center; }
